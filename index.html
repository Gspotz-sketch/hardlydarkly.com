<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0c0f24" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Hardly Darkly — a supernatural thriller. Currently under construction." />
    <title>Hardly Darkly — Under Construction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0c0f24;
        --bone: #e8e4d8;
        --bone-dim: rgba(232, 228, 216, 0.55);
        --ember: #c9a86a;
        --rule: rgba(232, 228, 216, 0.18);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background:
          radial-gradient(ellipse 90% 60% at 50% 118%, rgba(201, 168, 106, 0.10), transparent 60%),
          radial-gradient(ellipse 120% 80% at 50% -20%, rgba(38, 46, 92, 0.55), transparent 65%),
          var(--ink);
        color: var(--bone);
        font-family: "Cormorant Garamond", Georgia, serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        padding: 3rem 1.5rem;
        max-width: 34rem;
        animation: rise 1.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .eyebrow {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--ember);
        animation: flicker 5.5s ease-in-out infinite;
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        41%      { opacity: 1; }
        42%      { opacity: 0.55; }
        43%      { opacity: 1; }
        78%      { opacity: 1; }
        79%      { opacity: 0.6; }
        80%      { opacity: 1; }
      }
      h1 {
        font-size: clamp(2.75rem, 8vw, 4.5rem);
        font-weight: 500;
        letter-spacing: 0.02em;
        margin: 1.25rem 0 0.75rem;
      }
      .rule {
        width: 4.5rem;
        height: 1px;
        background: var(--rule);
        margin: 1.5rem auto;
      }
      p {
        font-size: 1.2rem;
        font-style: italic;
        color: var(--bone-dim);
        line-height: 1.6;
      }
      footer {
        position: fixed;
        bottom: 1.4rem;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(232, 228, 216, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Pardon the dust</div>
      <h1>Hardly Darkly</h1>
      <div class="rule"></div>
      <p>The manuscript is being re-bound. Something is stirring — return shortly.</p>
    </main>
    <footer>Under Construction</footer>
  </body>
</html>
